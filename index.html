<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚗 GRAND THEFT AUTO 2 (GBC) 🚗 | Nopex Arcade</title>
  <meta name="description" content="Jogue Grand Theft Auto 2 (Game Boy Color) da Rockstar Games online no navegador a 60 FPS com perseguições policiais, roubo de carros e tiroteios!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }

    #game-holder {
      width: 100%;
      height: 100%;
      max-width: 100%;
      position: absolute;
      inset: 0;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Floating Header Overlay */
    .floating-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10000;
      pointer-events: none;
    }

    .floating-bar a,
    .floating-bar button {
      pointer-events: auto;
    }

    .pill-btn {
      background: rgba(14, 14, 20, 0.88);
      border: 1px solid #ffd32a;
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #ffd32a;
      font-weight: 800;
      font-size: 11px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn:hover {
      background: #ffd32a;
      color: #000;
      box-shadow: 0 0 15px #ffd32a;
    }

    .floating-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #ffd32a;
      background: rgba(14, 14, 20, 0.88);
      border: 1px solid #ff3838;
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      text-shadow: 0 0 10px rgba(255, 211, 42, 0.6);
    }

    .floating-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Controls Modal */
    #controls-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 20, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20000;
    }

    .modal-box {
      background: #0f1019;
      border: 2px solid #ffd32a;
      border-radius: 12px;
      padding: 24px 30px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 0 35px rgba(255, 211, 42, 0.4);
    }

    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: #ffd32a;
      margin-bottom: 18px;
      text-align: center;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 12px;
    }

    .ctrl-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .key-badge {
      background: #ffd32a;
      color: #000;
      font-weight: 900;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close-btn {
      width: 100%;
      background: #ff3838;
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-close-btn:hover {
      background: #ffd32a;
      color: #000;
      box-shadow: 0 0 15px #ffd32a;
    }

    @media (max-width: 600px) {
      .floating-title { display: none; }
    }
  </style>
</head>
<body>
  <!-- Floating Top Bar -->
  <div class="floating-bar">
    <a href="https://marcuscaiado.github.io/nopex-arcade/" class="pill-btn" title="Voltar ao Fliperama 3D">
      ⬅️ FLIPERAMA
    </a>
    <div class="floating-title">GTA 2 (GBC)</div>
    <div class="floating-actions">
      <button id="btn-controls" class="pill-btn" title="Ver Controles">🎮 Controles</button>
      <button id="btn-fullscreen" class="pill-btn" title="Tela Cheia">🔲</button>
    </div>
  </div>

  <!-- Direct Emulator Mounting Node -->
  <div id="game-holder">
    <div id="game"></div>
  </div>

  <!-- Controls Modal -->
  <div id="controls-modal">
    <div class="modal-box">
      <div class="modal-title">🚗 CONTROLES GTA 2</div>
      <div class="controls-grid">
        <div class="ctrl-item"><span>Mover / Pilotar</span> <span class="key-badge">Setas / D-Pad</span></div>
        <div class="ctrl-item"><span>Acelerar / Atirar</span> <span class="key-badge">Z (Botão B)</span></div>
        <div class="ctrl-item"><span>Frear / Entrar Carro</span> <span class="key-badge">A (Botão A)</span></div>
        <div class="ctrl-item"><span>Trocar Arma</span> <span class="key-badge">Shift (Select)</span></div>
        <div class="ctrl-item"><span>Pausar / Menu</span> <span class="key-badge">Enter (Start)</span></div>
        <div class="ctrl-item"><span>Buzinar</span> <span class="key-badge">Shift + Cima</span></div>
      </div>
      <p style="font-size: 11px; color: #94a3b8; margin-bottom: 16px; text-align: center;">
        💡 Controles touch virtuais no celular e controles USB/Bluetooth funcionam nativamente!
      </p>
      <button id="modal-close" class="modal-close-btn">FECHAR E JOGAR</button>
    </div>
  </div>

  <script>
    // Controls modal
    const modal = document.getElementById('controls-modal');
    document.getElementById('btn-controls').addEventListener('click', () => modal.style.display = 'flex');
    document.getElementById('modal-close').addEventListener('click', () => modal.style.display = 'none');
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    // Fullscreen
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Autofocus canvas on click
    window.addEventListener('click', () => {
      const c = document.querySelector('canvas');
      if (c) c.focus();
    });

    // EmulatorJS Engine Config
    window.EJS_player = '#game';
    window.EJS_core = 'gbc';
    window.EJS_gameName = 'Grand Theft Auto 2';
    window.EJS_color = '#ffd32a';
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_gameUrl = 'roms/gta2.gbc';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
